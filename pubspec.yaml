name: liga_roca
description: App de futbol Liga Roca con noticias y fixture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    # Iconos
  cupertino_icons: ^1.0.2
  
  # Estado y Utilidades
  provider: ^6.0.0
  intl: ^0.18.0
  url_launcher: ^6.2.0
  
  # Firebase (Últimas versiones compatibles con Flutter 3.x)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.2.10
  change_app_package_name: ^1.5.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/Chitologo1024.png"
  min_sdk_android: 21 # Opcional, para asegurar compatibilidad

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
